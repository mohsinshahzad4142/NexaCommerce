name: NexaCommerce CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nexa_user
          POSTGRES_PASSWORD: nexa_password
          POSTGRES_DB: nexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx flake8 sqlalchemy pydantic fastapi

    - name: Run Pytest Test Suite
      env:
        DATABASE_URL: postgresql://nexa_user:nexa_password@localhost:5432/nexa_test
      run: |
        pytest tests/

  deploy-staging:
    needs: test-and-lint
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Staging Environment
      run: echo "Deploying NexaCommerce to Staging AWS ECS / Vercel..."

  deploy-production:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Production Environment
      run: echo "Deploying NexaCommerce to Production Kubernetes / Docker Cluster..."